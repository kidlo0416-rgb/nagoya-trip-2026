<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Our Central Japan Trip 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg-page:#FAF6EE;
  --card:#FFFFFF;
  --pink:#F7E9E2;
  --blue:#F3EBDD;
  --cream:#F6EDDB;
  --red:#E0A88C;
  --red-deep:#CC8E70;
  --red-soft:#F0C7B3;
  --green-acc:#D4AD7A;
  --green-deep:#BC8F58;
  --green-soft:#EAD3AC;
  --ink:#6B5E4F;
  --ink-soft:#BBAE9A;
  --ink-faint:#EAE0CC;
  --line:#F0E6D2;
  --gold:#DDBC85;
  --sky:#B7CFE0;
  --sun:#EFCB85;
  --rain:#9AB6C9;
  --shadow:0 4px 14px rgba(150,120,80,0.07);
  --shadow-sm:0 2px 8px rgba(150,120,80,0.06);
  --r-lg:20px;
  --r-md:15px;
  --r-sm:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Klee One',-apple-system,BlinkMacSystemFont,'PingFang TC','Microsoft JhengHei',sans-serif;
  background:#EAE0C8;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
.cute{font-family:'Hachi Maru Pop','Klee One',sans-serif;}

/* ===== App shell ===== */
.app-shell{
  max-width:460px;margin:0 auto;min-height:100vh;
  background:var(--bg-page);position:relative;overflow-x:hidden;
  box-shadow:0 0 50px rgba(60,40,20,0.10);padding-bottom:122px;
}
.status-bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 22px 4px;font-size:13px;font-weight:700;color:var(--ink);letter-spacing:0.5px;
}
.status-bar .icons{display:flex;gap:4px;align-items:center;font-size:12px;}

/* ===== Header / banner ===== */
.app-header{position:relative;padding:0 0 16px;overflow:hidden;}
.banner-img{width:100%;display:block;object-fit:cover;aspect-ratio:1579/656;border-radius:0 0 26px 26px;box-shadow:0 6px 18px rgba(120,90,60,0.12);}
.app-title-row{padding:14px 22px 0;}
.app-sub{font-size:12.5px;color:var(--ink-soft);font-weight:500;}
.app-web-tag{display:inline-block;margin-top:9px;font-size:11px;font-weight:700;color:var(--green-deep);background:var(--blue);padding:4px 10px;border-radius:999px;}

/* ===== Bottom nav ===== */
.bottom-nav{
  position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;
  display:flex;justify-content:space-around;align-items:center;
  background:rgba(255,252,246,0.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:10px 6px calc(10px + env(safe-area-inset-bottom));z-index:50;
}
.nav-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;cursor:pointer;font-family:inherit;color:var(--ink-soft);
  padding:4px 0;border-radius:14px;transition:all .2s;
}
.nav-tab .nav-icon{font-size:20px;line-height:1;transition:transform .2s;}
.nav-tab .nav-label{font-size:10.5px;font-weight:700;}
.nav-tab.active{color:var(--red-deep);}
.nav-tab.active .nav-icon{transform:translateY(-2px) scale(1.08);}

/* ===== FAB AI ===== */
.fab-ai{
  position:fixed;bottom:92px;right:18px;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg, var(--red) 0%, var(--green-acc) 100%);
  display:flex;align-items:center;justify-content:center;font-size:26px;border:3px solid #fff;
  box-shadow:0 5px 14px rgba(180,140,100,0.22);cursor:pointer;z-index:60;animation:fab-float 3s ease-in-out infinite;
}
@keyframes fab-float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

/* ===== Generic ===== */
.tab-content{padding:4px 18px 10px;}
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;position:relative;}
.card-title{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.card-title.cute{font-size:16px;}
.section-title{font-size:13px;font-weight:700;color:var(--ink-soft);letter-spacing:1px;margin:16px 4px 9px;}

/* ===== Day tabs ===== */
.day-tabs{display:flex;gap:7px;overflow-x:auto;padding:6px 0 12px;scrollbar-width:none;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-pill{
  flex:0 0 auto;padding:8px 14px;border-radius:999px;border:none;font-family:inherit;
  font-weight:700;font-size:12.5px;white-space:nowrap;background:#fff;color:var(--ink-soft);
  box-shadow:var(--shadow-sm);cursor:pointer;transition:all .2s;
}
.day-pill.active{background:linear-gradient(135deg, var(--red) 0%, var(--green-acc) 100%);color:#fff;box-shadow:0 3px 10px rgba(180,140,100,0.25);}

/* Stacked "DAY1 / 8/20" pill used in the expense tab day selector */
.date-pill{
  flex:0 0 auto;min-width:60px;padding:8px 10px;border-radius:16px;border:none;font-family:inherit;
  background:#fff;color:var(--ink-soft);box-shadow:var(--shadow-sm);cursor:pointer;transition:all .2s;
  display:flex;flex-direction:column;align-items:center;gap:1px;
}
.date-pill .dp-daylabel{font-size:10px;font-weight:700;line-height:1.1;letter-spacing:0.5px;opacity:0.75;}
.date-pill .dp-date{font-size:13.5px;font-weight:700;line-height:1.2;white-space:nowrap;}
.date-pill.active{background:linear-gradient(135deg, var(--red) 0%, var(--green-acc) 100%);color:#fff;box-shadow:0 3px 10px rgba(180,140,100,0.25);}

/* ===== Weather card (icon-based, live) ===== */
.weather-card{
  border-radius:var(--r-lg);padding:16px;margin:0 0 14px;
  background:linear-gradient(125deg, #FBF2E2 0%, #F2EBDA 55%, #E9EFE0 100%);
  box-shadow:var(--shadow);position:relative;overflow:hidden;border:1px solid rgba(255,255,255,0.7);
}
.weather-top-row{display:flex;align-items:center;gap:14px;}
.weather-icon-box{
  flex:0 0 58px;width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,0.75);
  display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:var(--shadow-sm);
}
.weather-mid{flex:1;min-width:0;}
.weather-daylabel{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:1px;}
.day-mission-title{font-size:17px;font-weight:700;line-height:1.4;margin:0;}
.weather-stats-row{display:flex;align-items:baseline;gap:10px;margin-top:9px;}
.weather-temp-big{font-size:26px;font-weight:700;}
.weather-temp-range{font-size:12px;color:var(--ink-soft);font-weight:600;}
.weather-rain-chip{font-size:12px;font-weight:700;color:var(--rain);background:rgba(255,255,255,0.75);padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:3px;}
.weather-source{display:inline-flex;align-items:center;gap:4px;margin-top:8px;font-size:10.5px;font-weight:700;color:var(--ink-soft);background:rgba(255,255,255,0.65);padding:3px 9px;border-radius:999px;}
.weather-source.live{color:var(--green-deep);}
.weather-tip{margin-top:9px;font-size:12.5px;font-weight:500;line-height:1.6;color:var(--ink);background:rgba(255,255,255,0.5);padding:8px 10px;border-radius:var(--r-sm);}

/* ===== Activity card with drag handle ===== */
.activity-card{display:flex;flex-direction:column;gap:0;transition:transform .2s, box-shadow .2s;}
.activity-card.dragging{opacity:0.4;}
.activity-card.drag-over{box-shadow:0 0 0 2px var(--green-acc), var(--shadow);}
.activity-row{display:flex;gap:10px;align-items:flex-start;}
.drag-handle{
  flex:0 0 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--ink-faint);font-size:14px;cursor:grab;padding:4px 0;touch-action:none;letter-spacing:-2px;line-height:0.6;margin-top:4px;
}
.drag-handle:active{cursor:grabbing;}
.check-circle{
  flex:0 0 28px;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--ink-faint);
  display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;
  transition:all .25s;background:#fff;margin-top:2px;user-select:none;
}
.check-circle.checked{
  border-color:transparent;background:linear-gradient(135deg, var(--red) 0%, var(--green-acc) 100%);
  box-shadow:0 0 0 3px rgba(224,168,140,0.20);animation:check-pop .3s ease;
}
@keyframes check-pop{0%{transform:scale(0.7);}60%{transform:scale(1.15);}100%{transform:scale(1);}}
.activity-content{flex:1;min-width:0;}
.activity-time{font-size:11px;font-weight:700;color:var(--green-deep);background:var(--blue);display:inline-block;padding:2px 8px;border-radius:999px;margin-bottom:6px;}
.activity-title{font-size:15.5px;font-weight:700;line-height:1.4;margin-bottom:4px;transition:all .3s;}
.activity-desc{font-size:13px;line-height:1.65;color:#71665A;font-weight:500;transition:all .3s;}
.activity-card.done .activity-title,.activity-card.done .activity-desc,.activity-card.done .activity-budget{
  opacity:0.42;text-decoration:line-through;text-decoration-color:var(--ink-soft);
}

/* Photo */
.activity-photo{width:100%;border-radius:var(--r-md);margin-top:10px;display:block;object-fit:cover;height:150px;background:var(--ink-faint);}
.activity-photo-credit{font-size:9.5px;color:var(--ink-soft);margin-top:3px;text-align:right;font-weight:500;}

/* Tags: must-eat / must-order / must-buy / reservation */
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:3px;}
.tag-eat{background:#FBE3D9;color:#B8552E;}
.tag-order{background:#FDEBC9;color:#9B7016;}
.tag-buy{background:#E2EAD8;color:#5C7235;}
.tag-reserve{background:#DCE6F0;color:#3E5E80;}

/* Collapsible detail */
.detail-toggle{
  margin-top:10px;display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;
  color:var(--green-deep);cursor:pointer;user-select:none;background:none;border:none;font-family:inherit;padding:0;
}
.detail-toggle .chev{transition:transform .25s;font-size:11px;}
.detail-toggle.open .chev{transform:rotate(180deg);}
.detail-panel{max-height:0;overflow:hidden;transition:max-height .3s ease;}
.detail-panel.open{max-height:800px;}
.detail-panel-inner{padding-top:9px;font-size:12.5px;line-height:1.7;color:#6B5F50;font-weight:500;}
.detail-panel-inner p{margin:0 0 8px;}

.phrase-box{margin-top:9px;background:var(--pink);border-radius:var(--r-sm);padding:9px 11px;font-size:12.5px;line-height:1.6;}
.phrase-jp{font-weight:700;color:var(--red-deep);display:block;margin-bottom:2px;}
.phrase-zh{color:#9B8B79;font-weight:500;}
.activity-budget{margin-top:8px;font-size:12px;font-weight:700;color:#A1822E;background:var(--cream);display:inline-block;padding:5px 9px;border-radius:var(--r-sm);}
.activity-footer{display:flex;justify-content:flex-end;margin-top:8px;}
.nav-btn{
  border:none;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;
  background:linear-gradient(135deg, var(--green-acc) 0%, var(--green-deep) 100%);
  color:#fff;cursor:pointer;box-shadow:0 3px 10px rgba(188,143,88,0.28);display:flex;align-items:center;gap:4px;font-family:inherit;
}

/* Restaurant group */
.rgroup-title{font-size:14.5px;font-weight:700;margin:16px 0 9px;display:flex;align-items:center;gap:6px;}
.rgroup-scroll{display:flex;gap:11px;overflow-x:auto;padding:0 0 14px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none;scroll-snap-type:x mandatory;}
.rcard{flex:0 0 80%;background:var(--card);border-radius:var(--r-lg);padding:14px;box-shadow:var(--shadow);scroll-snap-align:start;}
.rcard-name{font-size:14.5px;font-weight:700;margin-bottom:6px;line-height:1.4;}
.rcard-desc{font-size:12px;color:#71665A;line-height:1.6;font-weight:500;}
.rcard.done .rcard-name,.rcard.done .rcard-desc{opacity:0.42;text-decoration:line-through;}
.rcard-check-row{display:flex;align-items:center;gap:9px;margin-bottom:7px;}

/* Route timeline */
.route-timeline{position:relative;padding-left:36px;margin-top:4px;}
.route-timeline::before{content:'';position:absolute;left:13px;top:6px;bottom:6px;width:3px;background:linear-gradient(180deg, var(--red) 0%, var(--green-acc) 100%);border-radius:3px;opacity:0.35;}
.route-node{position:relative;margin-bottom:5px;padding:7px 0;}
.route-dot{position:absolute;left:-36px;top:3px;width:30px;height:30px;border-radius:50%;background:#fff;border:2.5px solid var(--red);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:var(--shadow-sm);}
.route-name{font-size:14.5px;font-weight:700;margin-bottom:6px;}
.route-tags{display:flex;flex-wrap:wrap;gap:6px;}
.route-tag{font-size:10.5px;font-weight:700;background:var(--pink);color:var(--red-deep);padding:4px 8px;border-radius:999px;}
.route-connector{position:relative;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#fff;margin:4px 0;padding:5px 11px 5px 0;}
.route-connector .conn-pill{position:absolute;left:-36px;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:var(--green-acc);display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:var(--shadow-sm);border:2.5px solid #fff;}
.route-connector .conn-label{background:var(--blue);color:var(--green-deep);padding:5px 11px;border-radius:999px;font-size:11px;font-weight:700;}

.team-card{background:linear-gradient(135deg, #DCEAF4 0%, #F0F5F9 100%);color:var(--ink);border-radius:var(--r-lg);padding:16px;margin-bottom:13px;box-shadow:var(--shadow);position:relative;overflow:hidden;}
.team-label{font-size:10.5px;font-weight:700;opacity:0.65;letter-spacing:2px;text-transform:uppercase;}
.team-name{font-size:18px;font-weight:700;margin:6px 0 4px;color:var(--ink);}
.team-dates{font-size:12px;font-weight:700;opacity:0.75;}

.pocket-card .pocket-item{display:flex;align-items:center;gap:11px;padding:7px 0;}
.pocket-item:not(:last-child){border-bottom:1px dashed var(--line);}
.pocket-text{font-size:13.5px;font-weight:600;transition:all .3s;}
.pocket-item.done .pocket-text{opacity:0.42;text-decoration:line-through;}

/* Packing */
.progress-wrap{background:var(--card);border-radius:var(--r-lg);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.progress-headline{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
.progress-headline .big{font-size:24px;font-weight:700;}
.progress-headline .small{font-size:12px;color:var(--ink-soft);font-weight:700;}
.progress-track{height:11px;background:var(--line);border-radius:999px;overflow:hidden;}
.progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg, var(--red) 0%, var(--green-acc) 100%);transition:width .4s ease;width:0%;}
.pack-cat{margin-bottom:7px;}
.pack-cat-title{font-size:13.5px;font-weight:700;margin:0 0 6px 4px;display:flex;align-items:center;gap:6px;}
.pack-item{display:flex;align-items:center;gap:11px;background:var(--card);border-radius:var(--r-md);padding:11px 13px;margin-bottom:7px;box-shadow:var(--shadow-sm);}
.pack-text{font-size:13px;font-weight:600;line-height:1.5;transition:all .3s;flex:1;}
.pack-item.done .pack-text{opacity:0.42;text-decoration:line-through;}

/* Expense - daily */
.total-card{background:linear-gradient(135deg, #E8C9AE 0%, #E3D2AE 45%, var(--green-soft) 100%);color:var(--ink);border-radius:var(--r-lg);padding:20px;margin-bottom:14px;box-shadow:var(--shadow);position:relative;overflow:hidden;text-align:center;}
.total-label{font-size:11px;font-weight:700;letter-spacing:2px;opacity:0.6;text-transform:uppercase;}
.total-amount{font-size:34px;font-weight:700;margin:7px 0 2px;color:var(--ink);}
.total-sub{font-size:11px;font-weight:600;opacity:0.65;}
.payer-split{display:flex;gap:10px;margin-top:12px;}
.payer-chip{flex:1;background:rgba(255,255,255,0.55);border-radius:var(--r-sm);padding:8px 10px;text-align:left;}
.payer-chip .pname{font-size:10.5px;opacity:0.65;font-weight:700;color:var(--ink);}
.payer-chip .pamt{font-size:14px;font-weight:700;margin-top:2px;color:var(--ink);}

.day-expense-card{margin-bottom:13px;}
.day-expense-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.day-expense-head .dlabel{font-size:14px;font-weight:700;}
.day-expense-head .dtotal{font-size:15px;font-weight:700;color:var(--red-deep);}
.expense-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:opacity .15s;}
.expense-row:active{opacity:0.7;}
.expense-row:last-child{border-bottom:none;}
.expense-icon{flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:var(--cream);display:flex;align-items:center;justify-content:center;font-size:14px;}
.expense-info{flex:1;min-width:0;}
.expense-name{font-size:13px;font-weight:700;}
.expense-payer{font-size:11px;color:var(--ink-soft);font-weight:600;margin-top:1px;}
.expense-amt{font-size:13.5px;font-weight:700;color:var(--ink);white-space:nowrap;}
.add-expense-btn{
  width:100%;border:1.5px dashed var(--ink-faint);background:none;border-radius:var(--r-md);
  padding:10px;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;margin-top:8px;
}
.exp-form{display:none;gap:8px;flex-direction:column;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
.exp-form.open{display:flex;}
.exp-form input,.exp-form select{
  border:1.5px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font-size:13px;
  font-family:inherit;color:var(--ink);background:#FCFAF4;
}
.exp-form-row{display:flex;gap:8px;}
.exp-form-row > *{flex:1;}
.exp-save-btn{background:var(--green-deep);color:#fff;border:none;border-radius:var(--r-sm);padding:9px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}
.exp-form-actions{display:flex;gap:8px;}
.exp-form-actions .exp-save-btn{flex:1;}
.exp-delete-btn{background:#fff;color:var(--red-deep);border:1.5px solid var(--red-soft);border-radius:var(--r-sm);padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit;}

.convert-row{display:flex;gap:8px;margin-top:11px;}
.convert-row input{flex:1;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font-size:13.5px;font-weight:700;font-family:inherit;color:var(--ink);background:#FCFAF4;}
.convert-row input:focus{outline:2px solid var(--green-acc);}
.convert-result{font-size:12.5px;font-weight:700;color:var(--green-deep);margin-top:7px;}

/* SOS */
.sos-big{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:var(--r-lg);padding:14px;margin-bottom:11px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);}
.sos-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;flex:0 0 44px;}
.sos-icon.police{background:var(--blue);}
.sos-icon.ambulance{background:var(--pink);}
.sos-icon.office{background:var(--cream);}
.sos-name{font-size:14px;font-weight:700;}
.sos-number{font-size:12.5px;font-weight:700;color:var(--green-deep);margin-top:2px;}
.sos-note{font-size:10.5px;color:var(--ink-soft);margin-top:4px;line-height:1.5;font-weight:500;}
.hotel-card{background:var(--card);border-radius:var(--r-lg);padding:13px 15px;margin-bottom:11px;box-shadow:var(--shadow);}
.hotel-name{font-size:14px;font-weight:700;margin-bottom:2px;}
.hotel-city{font-size:11px;color:var(--ink-soft);font-weight:700;margin-bottom:9px;}
.hotel-row{display:flex;gap:8px;}
.hotel-row input{flex:1;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font-size:13px;font-family:inherit;background:#FCFAF4;color:var(--ink);}
.call-btn{border:none;border-radius:var(--r-sm);padding:9px 15px;font-weight:700;font-size:12.5px;background:var(--green-acc);color:#fff;cursor:pointer;font-family:inherit;text-decoration:none;display:flex;align-items:center;gap:5px;white-space:nowrap;}

/* Lego mode */
.lego-mode .activity-card{border-radius:13px !important;border:3px solid #fff;position:relative;}
.lego-mode .activity-card::before{content:'';position:absolute;top:-8px;left:22px;width:16px;height:16px;border-radius:50%;background:inherit;border:3px solid #fff;}
.lego-mode .activity-card:nth-of-type(1){background:#F3E3D8;}
.lego-mode .activity-card:nth-of-type(2){background:#E6ECDD;}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(40,30,25,0.42);z-index:90;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
.overlay.show{opacity:1;pointer-events:auto;}
.sheet{background:var(--bg-page);border-radius:22px 22px 0 0;width:100%;max-width:460px;padding:14px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);box-shadow:0 -10px 40px rgba(0,0,0,0.15);}
.overlay.show .sheet{transform:translateY(0);}
.sheet-handle{width:34px;height:4px;background:var(--ink-faint);border-radius:999px;margin:0 auto 13px;}
.sheet-title{font-size:14.5px;font-weight:700;margin-bottom:13px;text-align:center;}
.sheet-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:var(--r-md);border:none;font-family:inherit;font-size:14px;font-weight:700;margin-bottom:9px;cursor:pointer;text-decoration:none;color:#fff;}
.sheet-btn.google{background:linear-gradient(135deg,#D4AD7A,#BC8F58);}
.sheet-btn.apple{background:linear-gradient(135deg,#43484F,#222428);}
.sheet-btn.cancel{background:var(--line);color:var(--ink-soft);}

/* AI chat */
.ai-modal{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(40,30,25,0.42);opacity:0;pointer-events:none;transition:opacity .25s;}
.ai-modal.show{opacity:1;pointer-events:auto;}
.ai-panel{background:var(--bg-page);border-radius:24px 24px 0 0;width:100%;max-width:460px;height:78vh;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .35s cubic-bezier(.32,.72,0,1);box-shadow:0 -10px 40px rgba(0,0,0,0.18);}
.ai-modal.show .ai-panel{transform:translateY(0);}
.ai-head{display:flex;align-items:center;gap:11px;padding:15px 17px;border-bottom:1px solid var(--line);}
.ai-avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;background:linear-gradient(135deg,var(--red),var(--green-acc));border:2.5px solid #fff;box-shadow:0 4px 10px rgba(140,90,55,0.3);flex:0 0 40px;}
.ai-head-text .name{font-size:14.5px;font-weight:700;}
.ai-head-text .status{font-size:11px;color:#BC8F58;font-weight:600;}
.ai-close{margin-left:auto;background:var(--line);border:none;width:30px;height:30px;border-radius:50%;font-size:15px;cursor:pointer;color:var(--ink-soft);}
.ai-body{flex:1;overflow-y:auto;padding:15px 17px;display:flex;flex-direction:column;gap:9px;}
.bubble{max-width:80%;padding:10px 13px;border-radius:17px;font-size:13px;line-height:1.6;font-weight:500;}
.bubble.assistant{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px;box-shadow:var(--shadow-sm);}
.bubble.user{align-self:flex-end;background:linear-gradient(135deg,var(--red),var(--green-acc));color:#fff;border-bottom-right-radius:4px;}
.ai-input-row{display:flex;gap:8px;padding:11px 15px calc(11px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;border-radius:0 0 24px 24px;}
.ai-input-row input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:10px 15px;font-size:13px;font-family:inherit;background:#FCFAF4;color:var(--ink);}
.ai-send{width:40px;height:40px;border-radius:50%;border:none;flex:0 0 40px;background:linear-gradient(135deg,var(--red),var(--green-acc));color:#fff;font-size:17px;cursor:pointer;}
.hidden{display:none !important;}
</style>
</head>

/* =========================================================
   WEATHER ICON HELPER
   Maps Open-Meteo WMO weather codes (or our simple rain%
   fallback) to an emoji icon for the icon-based weather card.
   ========================================================= */
function weatherIconFromCode(code){
  if(code === 0) return '☀️';
  if(code === 1 || code === 2) return '🌤️';
  if(code === 3) return '☁️';
  if(code >= 45 && code <= 48) return '🌫️';
  if(code >= 51 && code <= 57) return '🌦️';
  if(code >= 61 && code <= 67) return '🌧️';
  if(code >= 71 && code <= 77) return '🌨️';
  if(code >= 80 && code <= 82) return '🌧️';
  if(code >= 95) return '⛈️';
  return '🌤️';
}
function weatherIconFromRain(rainPct){
  const p = parseInt(rainPct, 10) || 0;
  if(p >= 60) return '🌧️';
  if(p >= 30) return '🌦️';
  if(p >= 10) return '🌤️';
  return '☀️';
}

function loadFromStorage(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return fallback;
    return JSON.parse(raw);
  } catch(e){ return fallback; }
}
function saveToStorage(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); } catch(e){ /* storage unavailable, fail silently */ }
}

// Apply any saved custom order to each day's activities array (stable sortId-based reorder).
let savedOrder = loadFromStorage(STORAGE_KEY_ORDER, {});
function applySavedOrder(){
  tripDays.forEach(day=>{
    const order = savedOrder[day.id];
    if(!order || !Array.isArray(order)) return;
    const bySort = {};
    day.activities.forEach(a=>{ bySort[a.sortId] = a; });
    const reordered = [];
    order.forEach(sid=>{ if(bySort[sid]){ reordered.push(bySort[sid]); delete bySort[sid]; } });
    // Append any new/unmatched activities (e.g. data updated after last save) at the end.
    Object.values(bySort).forEach(a=>reordered.push(a));
    if(reordered.length === day.activities.length) day.activities = reordered;
  });
}
applySavedOrder();

function uid(prefix, dayId, idx, sub){
  return prefix + ':' + dayId + ':' + idx + (sub!==undefined? ':'+sub : '');

function escapeQ(s){
  return (s||'').replace(/'/g,"\\'");
}
function escapeHtml(s){
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function renderDetailToggle(detailId, detailText){
  if(!detailText) return '';
  const isOpen = !!openDetailIds[detailId];
  return `<button class="detail-toggle ${isOpen?'open':''}" onclick="toggleDetail('${detailId}')">
      <span class="chev">▾</span> ${isOpen?'收合詳細介紹':'展開詳細介紹與攻略'}
    </button>
    <div class="detail-panel ${isOpen?'open':''}" id="detail-${detailId}">
      <div class="detail-panel-inner"><p>${escapeHtml(detailText)}</p></div>
    </div>`;
}
function toggleDetail(id){
  openDetailIds[id] = !openDetailIds[id];
  const btn = document.querySelector(`[onclick="toggleDetail('${id}')"]`);
  const panel = document.getElementById('detail-' + id);
  if(btn) btn.classList.toggle('open', !!openDetailIds[id]);
  if(panel) panel.classList.toggle('open', !!openDetailIds[id]);
  if(btn) btn.innerHTML = `<span class="chev">▾</span> ${openDetailIds[id]?'收合詳細介紹':'展開詳細介紹與攻略'}`;
}

}

function renderItinerary(){

  tripDays.forEach(d=>{
    html += `<button class="day-pill ${currentDay===d.id?'active':''}" onclick="selectDay('${d.id}')">${d.label}</button>`;
  });
  html += '</div>';

  if(currentDay === 'overview'){
    html += renderOverview();
  } else {
    const day = tripDays.find(d=>d.id===currentDay);
    html += renderDay(day);
  }

  document.getElementById('tab-content').innerHTML = html;
  const dayObj = tripDays.find(d=>d.id===currentDay);
  document.getElementById('tab-content').classList.toggle('lego-mode', !!(dayObj && dayObj.lego));
  if(dayObj){
    loadWeatherFor(dayObj);
    attachDragHandlers(dayObj.id);
  }
}

      html += `<div class="route-connector"><span class="conn-pill">${node.icon}</span><span class="conn-label">${node.label}</span></div>`;
    } else {
      const tags = node.tags ? `<div class="route-tags">${node.tags.map(t=>`<span class="route-tag">${t}</span>`).join('')}</div>` : '';
      html += `<div class="route-node"><div class="route-dot">${node.icon}</div><div class="route-name">${node.name}</div>${tags}</div>`;

  });

  html += '<div class="card pocket-card"><div class="card-title cute">🎒 口袋名單備用區</div>';

      const done = !!checkedItems[id];
      const detailId = id + ':detail';

        <div class="activity-row">

/* =========================================================
   DRAG-AND-DROP REORDER (persisted via localStorage)
   Supports desktop HTML5 drag events and touch-based
   pointer dragging for mobile, scoped to the drag-handle only
   so normal scrolling/tapping elsewhere is unaffected.
   ========================================================= */
let dragState = null;

function getDayItemEls(dayId){
  const list = document.getElementById('activity-list-' + dayId);
  if(!list) return [];
  return Array.from(list.children);
}

function persistOrderFromDOM(dayId){
  const els = getDayItemEls(dayId);
  const order = els.map(el=>el.dataset.sortid).filter(Boolean);
  savedOrder[dayId] = order;
  saveToStorage(STORAGE_KEY_ORDER, savedOrder);
  // Reorder the in-memory tripDays array to match, so future renders stay consistent.
  const day = tripDays.find(d=>d.id===dayId);
  if(!day) return;
  const bySort = {};
  day.activities.forEach(a=>{ bySort[a.sortId] = a; });
  const reordered = order.map(sid=>bySort[sid]).filter(Boolean);
  Object.keys(bySort).forEach(sid=>{ if(!order.includes(sid)) reordered.push(bySort[sid]); });
  if(reordered.length === day.activities.length) day.activities = reordered;
}

function attachDragHandlers(dayId){
  const list = document.getElementById('activity-list-' + dayId);
  if(!list) return;
  const items = Array.from(list.children);

  items.forEach(item=>{
    item.addEventListener('dragstart', (e)=>{
      dragState = {dayId, el:item};
      item.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    item.addEventListener('dragend', ()=>{
      item.classList.remove('dragging');
      items.forEach(i=>i.classList.remove('drag-over'));
      if(dragState) persistOrderFromDOM(dayId);
      dragState = null;
    });
    item.addEventListener('dragover', (e)=>{
      e.preventDefault();
      if(!dragState || dragState.el === item) return;
      item.classList.add('drag-over');
    });
    item.addEventListener('dragleave', ()=>{ item.classList.remove('drag-over'); });
    item.addEventListener('drop', (e)=>{
      e.preventDefault();
      item.classList.remove('drag-over');
      if(!dragState || dragState.el === item) return;
      const dragging = dragState.el;
      const rect = item.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      if(before) list.insertBefore(dragging, item);
      else list.insertBefore(dragging, item.nextSibling);
    });

    // Touch support: only the drag-handle initiates a touch-drag, so taps on
    // checkboxes, photos, and toggle buttons remain unaffected.
    const handle = item.querySelector('.drag-handle');
    if(!handle) return;
    let touchDragging = false;
    let placeholder = null;

    handle.addEventListener('touchstart', (e)=>{
      touchDragging = true;
      dragState = {dayId, el:item};
      item.classList.add('dragging');
      placeholder = document.createElement('div');
      placeholder.style.height = item.offsetHeight + 'px';
      placeholder.style.flex = '0 0 auto';
      item.parentNode.insertBefore(placeholder, item.nextSibling);
      item.style.position = 'fixed';
      item.style.zIndex = '999';
      item.style.width = item.getBoundingClientRect().width + 'px';
      item.style.left = item.getBoundingClientRect().left + 'px';
      const touch = e.touches[0];
      item.dataset.touchOffsetY = (touch.clientY - item.getBoundingClientRect().top);
      item.style.top = (touch.clientY - item.dataset.touchOffsetY) + 'px';
      e.preventDefault();
    }, {passive:false});

    handle.addEventListener('touchmove', (e)=>{
      if(!touchDragging) return;
      const touch = e.touches[0];
      item.style.top = (touch.clientY - item.dataset.touchOffsetY) + 'px';
      const elemBelow = document.elementFromPoint(touch.clientX, touch.clientY);
      const targetItem = elemBelow ? elemBelow.closest('[data-sortid]') : null;
      if(targetItem && targetItem !== item && targetItem.parentNode === item.parentNode.parentNode || (targetItem && targetItem !== item && list.contains(targetItem))){
        const rect = targetItem.getBoundingClientRect();
        const before = (touch.clientY - rect.top) < rect.height / 2;
        if(before) list.insertBefore(placeholder, targetItem);
        else list.insertBefore(placeholder, targetItem.nextSibling);
      }
      e.preventDefault();
    }, {passive:false});

    handle.addEventListener('touchend', ()=>{
      if(!touchDragging) return;
      touchDragging = false;
      item.style.position = '';
      item.style.zIndex = '';
      item.style.width = '';
      item.style.left = '';
      item.style.top = '';
      item.classList.remove('dragging');
      if(placeholder && placeholder.parentNode){
        placeholder.parentNode.insertBefore(item, placeholder);
        placeholder.remove();
      }
      placeholder = null;
      persistOrderFromDOM(dayId);
      dragState = null;
    });
  });
}

function renderPacking(){
  let total = 0, done = 0;
  packingData.forEach((cat,ci)=>{
    cat.items.forEach((item,ii)=>{
      total++;
      if(packingChecked[ci+'-'+ii]) done++;
    });
  });
  const pct = total? Math.round(done/total*100) : 0;

  let html = '<div class="tab-inner">';
  html += `<div class="progress-wrap">
    <div class="progress-headline">
      <div class="big">${pct}% 打包完成</div>
      <div class="small">${done} / ${total} 項</div>
    </div>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div>
  </div>`;

  packingData.forEach((cat,ci)=>{
    html += `<div class="pack-cat"><div class="pack-cat-title">${cat.icon} ${cat.cat}</div>`;
    cat.items.forEach((item,ii)=>{
      const key = ci+'-'+ii;
      const isDone = !!packingChecked[key];
      html += `<div class="pack-item ${isDone?'done':''}">
        <div class="check-circle ${isDone?'checked':''}" onclick="togglePack('${key}')">${isDone?'✓':''}</div>
        <div class="pack-text">${item}</div>
      </div>`;
    });
    html += '</div>';
  });

  html += '</div>';
  document.getElementById('tab-content').innerHTML = html;
}

function togglePack(key){
  packingChecked[key] = !packingChecked[key];
  saveToStorage(STORAGE_KEY_PACKING, packingChecked);
  renderPacking();
}

/* =========================================================
   RENDER: EXPENSE TAB (daily, with payer split)
   ========================================================= */
function renderExpense(){
  const allDayIds = Object.keys(dailyExpenses);
  let grandTotal = 0;
  const payerTotals = {'自己':0, '朋友':0};
  allDayIds.forEach(dId=>{
    (dailyExpenses[dId]||[]).forEach(e=>{
      grandTotal += e.amount;
      payerTotals[e.payer] = (payerTotals[e.payer]||0) + e.amount;
    });
  });

  let html = '<div class="tab-inner">';
  html += `<div class="total-card">
    <div class="total-label">總花費統計</div>
    <div class="total-amount">¥${grandTotal.toLocaleString()}</div>
    <div class="total-sub">所有天數加總（住宿費請自行加總入帳）</div>
    <div class="payer-split">
      <div class="payer-chip"><div class="pname">自己 已付</div><div class="pamt">¥${(payerTotals['自己']||0).toLocaleString()}</div></div>
      <div class="payer-chip"><div class="pname">朋友 已付</div><div class="pamt">¥${(payerTotals['朋友']||0).toLocaleString()}</div></div>
    </div>
  </div>`;

  // Horizontally-scrollable DAY1 8/20 style selector, app-style.
  html += '<div class="day-tabs">';
  allDayIds.forEach((dId, dIdx)=>{
    const active = currentExpenseDay === dId;
    const fullLabel = dayLabels[dId] || dId;
    const spaceIdx = fullLabel.indexOf(' ');
    const dayPart = spaceIdx > -1 ? fullLabel.slice(0, spaceIdx) : fullLabel;
    const datePart = spaceIdx > -1 ? fullLabel.slice(spaceIdx+1) : '';
    html += `<button class="date-pill ${active?'active':''}" onclick="selectExpenseDay('${dId}')">
      <span class="dp-daylabel">${dayPart}</span>
      <span class="dp-date">${datePart}</span>
    </button>`;
  });
  html += '</div>';

  const dId = currentExpenseDay;
  const entries = dailyExpenses[dId] || [];
  const dayTotal = entries.reduce((s,e)=>s+e.amount,0);
  html += `<div class="card day-expense-card">
    <div class="day-expense-head">
      <span class="dlabel">${dayLabels[dId]||dId}</span>
      <span class="dtotal">¥${dayTotal.toLocaleString()}</span>
    </div>`;
  entries.forEach(e=>{
    const isEditing = editingExpenseId === e.id;
    html += `<div class="expense-row" onclick="${isEditing? '' : `startEditExpense('${dId}','${e.id}')`}">
      <div class="expense-icon">${expenseCategoryIcons[e.cat]||'💴'}</div>
      <div class="expense-info">
        <div class="expense-name">${escapeHtml(e.name)}</div>
        <div class="expense-payer">付款人：${e.payer}　・　${e.cat}</div>
      </div>
      <div class="expense-amt">¥${e.amount.toLocaleString()}</div>
    </div>`;
    if(isEditing){
      html += `<div class="exp-form open" id="exp-edit-form-${e.id}" onclick="event.stopPropagation()">
        <input type="text" id="exp-edit-name-${e.id}" placeholder="項目名稱" value="${escapeHtml(e.name)}">
        <div class="exp-form-row">
          <input type="number" id="exp-edit-amount-${e.id}" placeholder="¥ 金額" value="${e.amount}">
          <select id="exp-edit-cat-${e.id}">
            <option value="交通" ${e.cat==='交通'?'selected':''}>🚄 交通</option>
            <option value="住宿" ${e.cat==='住宿'?'selected':''}>🏨 住宿</option>
            <option value="餐飲" ${e.cat==='餐飲'?'selected':''}>🍱 餐飲</option>
            <option value="門票/娛樂" ${e.cat==='門票/娛樂'?'selected':''}>🎟️ 門票/娛樂</option>
            <option value="雜支/採購" ${e.cat==='雜支/採購'?'selected':''}>🛍️ 雜支/採購</option>
          </select>
        </div>
        <div class="exp-form-row">
          <select id="exp-edit-payer-${e.id}">
            <option value="自己" ${e.payer==='自己'?'selected':''}>付款人：自己</option>
            <option value="朋友" ${e.payer==='朋友'?'selected':''}>付款人：朋友</option>
          </select>
        </div>
        <div class="exp-form-actions">
          <button class="exp-delete-btn" onclick="deleteExpense('${dId}','${e.id}')">🗑️ 刪除</button>
          <button class="exp-save-btn" onclick="updateExpense('${dId}','${e.id}')">儲存修改</button>
        </div>
      </div>`;
    }

    html += `<div style="font-size:12.5px;color:var(--ink-soft);font-weight:600;padding:10px 0;text-align:center;">這天還沒有支出紀錄</div>`;
  }

  html += `<div class="exp-form ${expenseFormOpenDay===dId?'open':''}" id="exp-form-${dId}">

      <input type="number" id="exp-amount-${dId}" placeholder="¥ 金額">
      <select id="exp-cat-${dId}">

        <option value="住宿">🏨 住宿</option>
        <option value="餐飲" selected>🍱 餐飲</option>
        <option value="門票/娛樂">🎟️ 門票/娛樂</option>
        <option value="雜支/採購">🛍️ 雜支/採購</option>
      </select>
    </div>
    <div class="exp-form-row">
      <select id="exp-payer-${dId}">
        <option value="自己" selected>付款人：自己</option>
        <option value="朋友">付款人：朋友</option>
      </select>
    </div>
    <button class="exp-save-btn" onclick="saveExpense('${dId}')">儲存紀錄</button>
  </div>`;
  html += '</div>';

  html += `<div class="card">
    <div class="card-title cute">💱 日幣快速換算</div>
    <div class="convert-row">
      <input id="jpy-input" type="number" placeholder="輸入日幣金額 (JPY)" oninput="convertCurrency()">
    </div>
    <div class="convert-result" id="convert-result">參考匯率：100 JPY ≈ 21 TWD（請依當日實際匯率為準）</div>
  </div>`;

  html += '</div>';
  document.getElementById('tab-content').innerHTML = html;
}

function selectExpenseDay(dId){
  currentExpenseDay = dId;
  expenseFormOpenDay = null;
  editingExpenseId = null;
  renderExpense();
}

function startEditExpense(dId, eId){
  editingExpenseId = eId;
  expenseFormOpenDay = null;
  renderExpense();
}

function updateExpense(dId, eId){
  const nameEl = document.getElementById('exp-edit-name-'+eId);
  const amountEl = document.getElementById('exp-edit-amount-'+eId);
  const catEl = document.getElementById('exp-edit-cat-'+eId);
  const payerEl = document.getElementById('exp-edit-payer-'+eId);
  const name = (nameEl.value||'').trim();
  const amount = parseFloat(amountEl.value);
  if(!name || !amount || amount <= 0){
    nameEl.style.outline = !name ? '2px solid var(--red)' : '';
    amountEl.style.outline = (!amount||amount<=0) ? '2px solid var(--red)' : '';
    return;
  }
  const entries = dailyExpenses[dId] || [];
  const entry = entries.find(e=>e.id===eId);
  if(entry){
    entry.name = name;
    entry.amount = amount;
    entry.cat = catEl.value;
    entry.payer = payerEl.value;
    saveToStorage(STORAGE_KEY_EXPENSES, dailyExpenses);
  }
  editingExpenseId = null;
  renderExpense();
}

function deleteExpense(dId, eId){
  if(!dailyExpenses[dId]) return;
  dailyExpenses[dId] = dailyExpenses[dId].filter(e=>e.id!==eId);
  saveToStorage(STORAGE_KEY_EXPENSES, dailyExpenses);
  editingExpenseId = null;
  renderExpense();
}

function toggleExpenseForm(dId){
  expenseFormOpenDay = (expenseFormOpenDay === dId) ? null : dId;
  editingExpenseId = null;
  renderExpense();
}

function saveExpense(dId){
  const nameEl = document.getElementById('exp-name-'+dId);
  const amountEl = document.getElementById('exp-amount-'+dId);
  const catEl = document.getElementById('exp-cat-'+dId);
  const payerEl = document.getElementById('exp-payer-'+dId);
  const name = (nameEl.value||'').trim();
  const amount = parseFloat(amountEl.value);
  if(!name || !amount || amount <= 0){
    nameEl.style.outline = !name ? '2px solid var(--red)' : '';
    amountEl.style.outline = (!amount||amount<=0) ? '2px solid var(--red)' : '';
    return;
  }
  if(!dailyExpenses[dId]) dailyExpenses[dId] = [];
  dailyExpenses[dId].push({
    id:'e-' + Date.now(),
    name, amount, cat:catEl.value, payer:payerEl.value
  });
  saveToStorage(STORAGE_KEY_EXPENSES, dailyExpenses);
  expenseFormOpenDay = null;
  renderExpense();
}

function convertCurrency(){
  const v = parseFloat(document.getElementById('jpy-input').value);
  const result = document.getElementById('convert-result');
  if(!v || v<=0){
    result.textContent = '參考匯率：100 JPY ≈ 21 TWD（請依當日實際匯率為準）';
    return;
  }
  const twd = (v * 0.21).toFixed(0);
  result.textContent = `約 ¥${v.toLocaleString()} JPY ≈ NT$${Number(twd).toLocaleString()}（參考匯率，請依當日實際匯率為準）`;
}

function callHotel(i){
  const input = document.getElementById('hotel-tel-'+i);
  const num = (input.value||'').trim();
  if(!num){
    input.focus();
    input.placeholder = '請先輸入飯店電話再撥打';
    return;
  }
  window.location.href = 'tel:' + num.replace(/[^0-9+]/g,'');

/* =========================================================
   TAB SWITCHING
   ========================================================= */
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.nav-tab').forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.tab===tab);
  });
  document.getElementById('tab-content').classList.remove('lego-mode');
  if(tab==='itinerary') renderItinerary();
  else if(tab==='packing') renderPacking();
  else if(tab==='expense') renderExpense();
  else if(tab==='sos') renderSOS();
  window.scrollTo({top:0, behavior:'smooth'});
}

  }
}
function closeAIChatOutside(e){
  if(e.target.id === 'ai-modal') toggleAIChat();
}
function appendBubble(text, who){
  const body = document.getElementById('ai-body');
  const div = document.createElement('div');
  div.className = 'bubble ' + who;
  div.textContent = text;
  body.appendChild(div);
  body.scrollTop = body.scrollHeight;
  return div;
}
function seedAIChat(){
  const body = document.getElementById('ai-body');
  body.innerHTML = '';
  appendBubble('嗨！我是旅遊小助手，隨時都可以問我這趟日本旅程的細節，這裡先幫你整理幾個大家常問的問題～', 'assistant');
  aiPresetTopics.forEach(t=>{
    appendBubble(t.user, 'user');
    appendBubble(t.reply, 'assistant');
  });
}
function sendAIMessage(){
  const input = document.getElementById('ai-input');
  const text = (input.value||'').trim();
  if(!text) return;
  appendBubble(text, 'user');
  input.value = '';
  const typing = appendBubble('思考中...', 'assistant');
  setTimeout(()=>{
    typing.remove();
    const topic = aiPresetTopics[aiTopicIndex % aiPresetTopics.length];
    aiTopicIndex++;
    appendBubble('收到！這個我先用行程手冊裡最相關的提示回答你：' + topic.reply, 'assistant');
  }, 700);
}

/* =========================================================
   WEATHER ENGINE
   Live forecast (Open-Meteo) when within ~16 days of the
   trip date; otherwise falls back to historical climate
   averages, clearly labeled either way.
   ========================================================= */
const weatherCache = {};

async function loadWeatherFor(day){
  const w = day.weather;
  const iconEl = document.getElementById('weather-icon-' + day.id);
  const tempEl = document.getElementById('weather-temp-' + day.id);
  const rangeEl = document.getElementById('weather-range-' + day.id);
  const rainEl = document.getElementById('weather-rain-' + day.id);
  const sourceEl = document.getElementById('weather-source-' + day.id);
  if(!tempEl) return;

  if(weatherCache[day.id]){
    paintWeather(day, weatherCache[day.id], iconEl, tempEl, rangeEl, rainEl, sourceEl);
    return;
  }

  const today = new Date();
  const target = new Date(day.isoDate + 'T00:00:00');
  const diffDays = Math.ceil((target - today) / 86400000);

  if(diffDays >= 0 && diffDays <= 15){
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode&timezone=Asia%2FTokyo&start_date=${day.isoDate}&end_date=${day.isoDate}`;
      const res = await fetch(url);
      if(!res.ok) throw new Error('forecast fetch failed');
      const data = await res.json();
      const tMax = data.daily?.temperature_2m_max?.[0];
      const tMin = data.daily?.temperature_2m_min?.[0];
      const rain = data.daily?.precipitation_probability_max?.[0];
      const code = data.daily?.weathercode?.[0];
      if(tMax === undefined || tMax === null) throw new Error('no forecast data yet');
      const result = {
        temp: Math.round(tMax) + '°C',
        tempLow: (tMin!==undefined && tMin!==null) ? Math.round(tMin) + '°C' : '',
        rain: (rain ?? 0) + '%',
        icon: weatherIconFromCode(code),
        live:true
      };
      weatherCache[day.id] = result;
      paintWeather(day, result, iconEl, tempEl, rangeEl, rainEl, sourceEl);
      return;
    } catch(e){ /* fall through to historical fallback */ }
  }

  const fallback = {
    temp: w.temp, tempLow: w.tempLow || '', rain: w.rain,
    icon: weatherIconFromRain(w.rain), live:false
  };
  weatherCache[day.id] = fallback;
  paintWeather(day, fallback, iconEl, tempEl, rangeEl, rainEl, sourceEl);
}

function paintWeather(day, result, iconEl, tempEl, rangeEl, rainEl, sourceEl){
  if(!document.getElementById('weather-temp-' + day.id)) return;
  if(iconEl) iconEl.textContent = result.icon;
  tempEl.textContent = result.temp;
  if(rangeEl) rangeEl.textContent = result.tempLow ? ('/ ' + result.tempLow) : '';
  rainEl.textContent = '☔ ' + result.rain;
  if(result.live){
    sourceEl.textContent = '📡 即時天氣預報';
    sourceEl.classList.add('live');
  } else {
    sourceEl.textContent = '歷史氣候參考值（' + day.weather.city + ' 8月平均，尚非即時預報）';
    sourceEl.classList.remove('live');
  }
}
